name: lint
on:
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      # See R-CMD-check.yaml: keep the repo's renv autoloader off in CI so the
      # dependency cache actually saves and installs come as RSPM binaries.
      RENV_CONFIG_AUTOLOADER_ENABLED: false
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::lintr, any::air
      - name: lint
        run: Rscript -e 'lintr::lint_package()'
