name: release

# Publish a GitHub release whose notes are the matching section of NEWS.md.
# Triggered by pushing a version tag (e.g. v0.1.0), or run by hand from the
# Actions tab for a version you name.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the leading v (e.g. 0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the version and tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ github.event.inputs.version }}"
            tag="v${version}"
          else
            tag="${GITHUB_REF_NAME}"
            version="${tag#v}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Pull this version's notes out of NEWS.md
        run: |
          version="${{ steps.version.outputs.version }}"
          # Print the lines under the "# ... <version>" heading, stopping at the
          # next top-level heading. index() is a fixed-string match, so the dots
          # in the version are taken literally.
          awk -v ver="$version" '
            /^# / { if (found) exit; found = (index($0, ver) > 0); next }
            found { print }
          ' NEWS.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::No NEWS.md entry found for version ${version}."
            exit 1
          fi
          echo "----- release notes -----"
          cat release-notes.md

      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.version.outputs.tag }}"
          title="obt ${{ steps.version.outputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$title" --notes-file release-notes.md
          else
            gh release create "$tag" --title "$title" --notes-file release-notes.md
          fi
